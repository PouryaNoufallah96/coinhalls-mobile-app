name: coin_hall
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.12+55

environment:
  sdk: ^3.12.2

dependencies:
  android_id: ^0.5.2+1
  bloc: ^9.2.1
  bloc_concurrency: ^0.3.0
  collection: ^1.19.1
  crypto: ^3.0.7
  cryptography: ^2.9.0
  curl_logger_dio_interceptor: ^1.0.1
  decimal: ^3.2.5
  device_info_plus: ^12.4.0
  dio: ^5.11.0
  equatable: ^2.1.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_hooks: ^0.21.3+1
  flutter_secure_storage: ^9.2.4
  flutter_svg: ^2.3.0
  font_awesome_flutter: ^11.0.0
  freezed_annotation: ^3.1.0
  go_router: ^17.3.0
  google_fonts: ^8.2.0
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4
  http: ^1.6.0
  hydrated_bloc: ^11.0.0
  intl: ^0.20.3
  json_annotation: ^4.12.0
  logging: ^1.3.0
  lottie: ^3.5.1
  path_provider: ^2.1.6
  pretty_dio_logger: ^1.4.0
  reown_appkit: ^1.8.3
  reown_walletkit: ^1.4.0
  rxdart: ^0.28.0
  signalr_netcore: ^1.4.4
  toastification: ^3.2.0
  url_launcher: ^6.3.2
  uuid: ^4.6.0
  web3dart: ^3.0.3
  web_socket_client: ^0.2.1

dev_dependencies:
  build_runner: ^2.15.1
  flutter_gen_runner: ^5.15.0
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^3.2.6-dev.1
  hive_ce_generator: ^1.11.2
  json_serializable: ^6.14.0
  very_good_analysis: ^10.3.0


flutter_gen:
  output: lib/gen
  integrations:
    flutter_svg: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/
    - assets/icons/
  fonts:
    - family: CentraNo1-Bold
      fonts:
        - asset: assets/fonts/CentraNo1-Bold.ttf
    - family: CentraNo1-Medium
      fonts:
        - asset: assets/fonts/CentraNo1-Medium.ttf
    - family: CentraNo1-Book
      fonts:
        - asset: assets/fonts/CentraNo1-Book.ttf

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/app_icon.png"
  image_path_ios: "assets/images/app_icon_ios.png"
  adaptive_icon_foreground: "assets/images/app_icon.png"
  min_sdk_android: 23
  remove_alpha_ios: true