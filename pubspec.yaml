name: coin_hall
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.6.2

dependencies:
  android_id: ^0.4.0
  bloc: ^9.0.0
  bloc_concurrency: ^0.3.0
  collection: ^1.19.1
  crypto: ^3.0.6
  cryptography: ^2.7.0
  curl_logger_dio_interceptor: ^1.0.0
  decimal: ^3.2.4
  device_info_plus: ^11.5.0
  dio: ^5.9.0
  equatable: ^2.0.7
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_hooks: ^0.21.3
  flutter_secure_storage: ^9.2.4
  flutter_svg: ^2.2.0
  font_awesome_flutter: ^10.9.1
  freezed_annotation: ^2.4.4
  go_router: ^17.0.0
  google_fonts: ^6.3.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  http: ^1.5.0
  hydrated_bloc: ^10.1.1
  intl: ^0.20.2
  json_annotation: ^4.9.0
  logging: ^1.3.0
  lottie: ^3.3.1
  path_provider: ^2.1.5
  pretty_dio_logger: ^1.4.0
  reown_appkit: ^1.5.0
  reown_walletkit: ^1.2.0
  rxdart: ^0.28.0
  signalr_netcore: ^1.4.3
  toastification: ^3.0.3
  url_launcher: ^6.3.2
  uuid: ^4.5.1
  web3dart: ^2.7.3
  web_socket_client: ^0.2.1

dev_dependencies:
  build_runner: ^2.5.4
  flutter_gen_runner: ^5.10.0
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  freezed: ^2.5.7
  hive_generator: ^2.0.1
  json_serializable: ^6.9.0
  very_good_analysis: ^9.0.0

flutter_gen:
  output: lib/gen
  integrations:
    flutter_svg: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/
    - assets/icons/
  fonts:
    - family: CentraNo1-Bold
      fonts:
        - asset: assets/fonts/CentraNo1-Bold.ttf
    - family: CentraNo1-Medium
      fonts:
        - asset: assets/fonts/CentraNo1-Medium.ttf
    - family: CentraNo1-Book
      fonts:
        - asset: assets/fonts/CentraNo1-Book.ttf

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/app_icon.webp"
  image_path_ios: "assets/images/app_icon_ios.png"
  adaptive_icon_foreground: "assets/images/app_icon.webp"
  min_sdk_android: 23
  remove_alpha_ios: true